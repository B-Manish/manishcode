[project]
name = "mcp-ollama-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "ollama>=0.6.2",
    "prompt-toolkit>=3.0",
]

[project.scripts]
mcp-ollama = "mcp_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_client"]
