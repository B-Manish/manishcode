[project]
name = "manishcode"
version = "0.1.0"
description = "Chat with a local Ollama model that can call MCP server tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Batchu Manish" }]
dependencies = [
    "mcp>=2.2.0",
    "ollama>=0.6.2",
    "prompt-toolkit>=3.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.urls]
Repository = "https://github.com/B-Manish/manishcode"

[project.scripts]
manishcode = "mcp_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_client"]
